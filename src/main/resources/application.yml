server:
  port: 8083

spring:
  r2dbc:
    url: r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:capacity_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  sql:
    init:
      mode: always

webclient:
  technology: ${WEBCLIENT_TECHNOLOGY:http://localhost:8084/api/v1/technology/capacity-technologies}

allowed-origins: ${ALLOWED_ORIGIN:http://localhost:4200}

appDescription: "Pragma Reactive Capacity"
appVersion: "1.0.0"
